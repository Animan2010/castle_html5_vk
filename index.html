<script type="module">

              const urlParams = new URLSearchParams(window.location.search);
              const player_id = urlParams.get('viewer_id');

              window.InitVkWebApp = function initVkWebApp() {
                     vkBridge.send('VKWebAppInit').then((data) => {
                                if (data.result) {
                                   try {
                                                // Приложение инициализировано
                                                vkBridge.send('VKWebAppShowBannerAd', {
                                                   banner_location: 'bottom'
                                                   })
                                                  .then((data) => {
                                                     if (data.result) {
                                                       // Баннерная реклама отобразилась
                                                     }
                                                   })
                                                   .catch((error) => {
                                                     // Ошибка
                                                        window.LogMetrikaEvent('error_event', 'error_show_banner_ad');
                                                   });
                                     } catch (error) {
                                           window.LogMetrikaEvent('error_event', 'error_send_banner_request');
                                     }
                                } else {
                                  // Ошибка
                                  window.LogMetrikaEvent('error_event', 'error_init_vk_web_app');
                                }
                              })
                              .catch((error) => {
                                // Ошибка
                                window.LogMetrikaEvent('error_event', 'error_send_vk_init_request');
                                console.log(error);
                              });
              }

              window.LogMetrikaEvent = function logMetrikaEvent(event_name, event_param) {
                     try {
                            ym(103903601,'reachGoal',event_name,{desc: event_param});
                     } catch (error) {
                            console.log("Error sending event to Yandex Metrika");
                     }
              }

              //window.InitVkWebApp();

              window.ShowInterstitial = function showInterstitial() {
                     try {
                            vkBridge.send("VKWebAppShowNativeAds", {"ad_format": "interstitial"});
                     } catch (error) {
                            window.LogMetrikaEvent('error_event', 'error_show_interstitial');
                     }
              }

              window.LogEventWeb = function logEventWeb(message) {
                     console.log(message);
              }

              window.ShowRewarded = function showRewarded() {
                     try {
                     vkBridge.send("VKWebAppShowNativeAds", {ad_format:"reward"})
                            .then(data => window.OnRewardedVideoShown(data.result))
                            .catch(error => console.log(error));
                     } catch (error) {
                             window.LogMetrikaEvent('error_event', 'error_show_rewarded');
                     }
              }

              window.BuyInApp = function buyInApp(inapp_id) {
                     vkBridge.send("VKWebAppShowOrderBox", {type:"item",item:inapp_id})
                       .then(data => window.OnInAppBought(data.success, inapp_id))
                       .catch(error => console.log(error));
              }

              window.GetKey = function getKey(key) {
                     try {
                            vkBridge.send("VKWebAppStorageGet", {"keys": [key]})
                                   .then(data => window.OnGetKey(key, data.keys[0].value))
                                   .catch(error => console.log(error));
                     } catch (error) {
                             window.LogMetrikaEvent('error_event', 'error_get_key');
                     }
              }

              window.SetKey = function setKey(k, v) {
                     try {
                            vkBridge.send("VKWebAppStorageSet", {
                               key: k,
                               value: v
                            });
                     } catch (error) {
                             window.LogMetrikaEvent('error_event', 'error_set_key');
                             }
              }

              window.CheckRewarded = function checkRewarded() {
                     try {
                     vkBridge.send("VKWebAppCheckNativeAds", {ad_format:"reward"})
                            .then(data => window.OnRewardedVideoCheck(data.result))
                            .catch(error => console.log(error));
                     } catch (error) {}
              }

              window.CheckInterstitial = function checkInterstitial() {
                     try {
                     vkBridge.send("VKWebAppCheckNativeAds", {"ad_format": "interstitial"})
                            .then(data => console.log(data.result))
                            .catch(error => console.log(error));
                    } catch (error) {}
              }

              window.ShareLevel = function shareLevel(lvl) {
              }

              window.SetRecord = function setRecord(lvl) {
                     try {
                            vkBridge.send("VKWebAppCallAPIMethod",
                                   {"method": "secure.addAppEvent", "request_id": "set_record",
                                   "params": {
                                          "user_id": player_id,
                                          "activity_id":"1",
                                          "value":lvl
                                          }});
                     } catch (error) {
                             window.LogMetrikaEvent('error_event', 'error_set_record');
                      }
              }

              window.InviteFriends = function inviteFriends() {
                     vkBridge.send("VKWebAppShowInviteBox", {})
                             .then(data => console.log(data.success))
                             .catch(error => console.log(error));
              }

              window.LogLevelFailed = function logLevelFailed(lvl) {

              }

              window.LogLevelCompleted = function logLevelCompleted(lvl) {

              }

              window.LogEvent = function logCustomEvent(event_name, event_param, event_param_value) {
                     window.LogMetrikaEvent('error_event', event_name + "::" + event_param + "::" + event_param_value);
              }

              window.ShowRecords = function showRecords(lvl) {
                     vkBridge.send("VKWebAppShowLeaderBoardBox", {user_result:lvl})
                            .then(data => console.log(data.success))
                            .catch(error => console.log(error));
              }

              function handleMouseDown(evt) {
                evt.preventDefault();
                evt.stopPropagation();
                window.focus();
              }

              function handleMouseUp(evt) {
                evt.preventDefault();
                evt.stopPropagation();
              }
              document.addEventListener('contextmenu', event => event.preventDefault());
              document.getElementById('embed-html').addEventListener('mousedown', handleMouseDown, false);
              document.getElementById('embed-html').addEventListener('mouseup', handleMouseUp, false);
       </script>
